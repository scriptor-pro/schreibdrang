# Compile Schreibdrang pour Linux, Windows et macOS, et dépose les paquets
# dans l'onglet « Actions » de GitHub (rubrique « Artifacts » de chaque passage).
#
# Lancement :
#   - à la main : onglet Actions > Compilation > Run workflow
#     (n'apparaît qu'une fois ce fichier présent sur la branche main) ;
#   - automatiquement, à l'envoi d'une étiquette v…, par exemple v0.0.40.

name: Compilation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  paquets:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: linux
            os: ubuntu-22.04
            args: ""
          - nom: windows
            os: windows-latest
            args: ""
          # Un seul paquet pour les Mac à processeur Apple et Intel.
          - nom: macos
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Bibliothèques nécessaires sous Linux
        if: matrix.nom == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.nom == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: schreibdrang-${{ matrix.nom }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
